<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background outer circular badge color -->
    <radialGradient id="badge-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1E2C" />
      <stop offset="100%" stop-color="#0D1B2A" />
    </radialGradient>
  </defs>

  <!-- Outer background circle -->
  <circle cx="512" cy="512" r="500" fill="url(#badge-bg)" />

  <!-- Layer 1: Concentric Outer Dark Circle -->
  <circle cx="512" cy="512" r="400" fill="#112531" />

  <!-- Layer 2: Concentric Inner Dark Circle -->
  <circle cx="512" cy="512" r="280" fill="#182D38" />

  <!-- Layer 3: Main S-Curve Spine -->
  <path
    d="M 606 848 C 403 670, 142 681, 550 528 C 816 447, 636 324, 484 224"
    stroke="#4CAF8A"
    stroke-width="66"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Layer 4: Bottom Terminal Circular Dot -->
  <circle cx="606" cy="848" r="64" fill="#4CAF8A" />

  <!-- Layer 5: Sprout Leaf (3D Tilted Pill Shape) at the Top Left -->
  <g transform="translate(435, 198) rotate(-33)">
    <!-- Underside bevel to give a gorgeous 3D premium thickness -->
    <ellipse cx="0" cy="12" rx="84" ry="42" fill="#4CAF8A" />
    <!-- Top premium mint surface -->
    <ellipse cx="0" cy="0" rx="84" ry="42" fill="#A8D8B9" />
  </g>
</svg>
