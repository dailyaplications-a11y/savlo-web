<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g style="transform: scale(90%); transform-origin: center">
    <g transform="translate(40, 24)">
      <!-- S-curve stem -->
      <path
        d="M 68 120 C 5 120, 5 74, 50 74 C 95 74, 95 18, 32 18"
        stroke="#4CAF8A"
        stroke-width="10.5"
        stroke-linecap="round"
        fill="none"
      />
      <!-- Bottom terminal dot -->
      <circle cx="68" cy="120" r="12" fill="#4CAF8A" />
      <!-- Top dot -->
      <circle cx="32" cy="18" r="9.5" fill="#4CAF8A" />
      <!-- Sprout leaf — 3D pill: bevel underneath + bright surface on top -->
      <g transform="translate(37, 10) rotate(-32)">
        <ellipse cx="0" cy="6" rx="17" ry="7.5" fill="#4CAF8A" />
        <ellipse cx="0" cy="0" rx="17" ry="7.5" fill="#A8D8B9" />
      </g>
    </g>
  </g>
</svg>
